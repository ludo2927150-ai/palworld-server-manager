<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Palworld Manager</title>
<style>
  :root { --bg:#020617; --card:#0f172a; --line:#1e293b; --text:#f1f5f9; --mute:#94a3b8; --pal:#14b8a6; --bad:#ef4444; --warn:#f59e0b; --ok:#34d399; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; padding:env(safe-area-inset-top) 12px 40px; }
  h1 { font-size:18px; margin:14px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 { font-size:14px; margin:0 0 8px; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--mute); display:inline-block; }
  .dot.on { background:var(--ok); } .dot.off { background:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat b { display:block; font-size:24px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--pal); }
  .bar i.hi { background:var(--warn); } .bar i.crit { background:var(--bad); }
  button { font:inherit; color:var(--text); background:var(--line); border:0; border-radius:10px; padding:12px 14px; min-height:44px; }
  button.primary { background:var(--pal); color:#00110f; font-weight:600; }
  button.danger { background:var(--bad); font-weight:600; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > button { flex:1; }
  input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; width:100%; }
  .player { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .player:first-of-type { border-top:0; } .player span.n { flex:1; } .player small { color:var(--mute); }
  #logs { font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; height:240px; overflow-y:auto; background:var(--bg); border-radius:8px; padding:8px; word-break:break-all; }
  #logs .e { color:#f87171; } #logs .w { color:#fcd34d; }
  svg { width:100%; height:56px; display:block; } svg path { fill:none; stroke:var(--pal); stroke-width:2; stroke-linejoin:round; }
  #toast { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); background:#1e293b; padding:12px 14px; border-radius:10px; display:none; }
  .mute { color:var(--mute); font-size:13px; }
  #login { max-width:420px; margin:12vh auto 0; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Palworld Manager</h1>
  <div class="card">
    <p class="mute">Entrez le jeton d'accès affiché dans l'application (Application → Accès mobile).</p>
    <input id="tok" type="password" autocomplete="off" placeholder="Jeton d'accès">
    <p><button class="primary" id="go" style="width:100%">Se connecter</button></p>
    <p id="loginerr" class="mute" style="color:var(--bad)"></p>
  </div>
</div>

<main id="app" hidden>
  <h1><span id="dot" class="dot"></span><span id="state">…</span><span id="who" class="mute" style="font-size:13px"></span><button id="logout" style="margin-left:auto;padding:6px 10px;min-height:0;font-size:13px">Déconnexion</button></h1>

  <div class="grid" id="sec-status">
    <div class="card stat"><h2>CPU</h2><b id="cpu">–</b><div class="bar"><i id="cpubar"></i></div></div>
    <div class="card stat"><h2>Mémoire</h2><b id="mem">–</b><div class="bar"><i id="membar"></i></div></div>
    <div class="card stat"><h2>Joueurs</h2><b id="pl">–</b></div>
    <div class="card stat"><h2>FPS serveur</h2><b id="fps">–</b><span class="mute" id="day"></span></div>
  </div>

  <div class="card" id="sec-control">
    <h2>Contrôle</h2>
    <div class="row">
      <button class="primary" id="b-start">Démarrer</button>
      <button id="b-restart">Redémarrer</button>
      <button class="danger" id="b-stop">Arrêter</button>
    </div>
    <div class="row" style="margin-top:8px"><button id="b-backup">Sauvegarder maintenant</button></div>
  </div>

  <div class="card" id="sec-players"><h2>Joueurs connectés</h2><div id="players" class="mute">–</div></div>

  <div class="card" id="sec-say">
    <h2>Annonce en jeu</h2>
    <div class="row"><input id="msg" placeholder="Message à tous les joueurs" style="flex:3"><button id="b-say" style="flex:1">Envoyer</button></div>
  </div>

  <div class="card sec-charts"><h2>CPU · 6 h</h2><svg id="s-cpu" viewBox="0 0 300 56" preserveAspectRatio="none"><path d=""/></svg></div>
  <div class="card sec-charts"><h2>Mémoire · 6 h</h2><svg id="s-mem" viewBox="0 0 300 56" preserveAspectRatio="none"><path d=""/></svg></div>
  <div class="card" id="sec-logs"><h2>Journal</h2><div id="logs"></div></div>
</main>
<div id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const KEY = "palmanager.token";
  let token = null, offset = null, timer = null, me = { perms: [], admin: false, name: "" };
  const can = (p) => me.admin || me.perms.includes(p);

  // Jeton dans l'URL (#token=…) : on l'enregistre puis on l'efface de la barre d'adresse.
  const m = location.hash.match(/token=([0-9a-zA-Z_-]+)/);
  if (m) { try { localStorage.setItem(KEY, m[1]); } catch {} history.replaceState(null, "", location.pathname); }
  try { token = localStorage.getItem(KEY); } catch {}

  function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = "none"), 4000); }

  async function api(path, opt = {}) {
    const r = await fetch("/api/" + path, { ...opt, headers: { Authorization: "Bearer " + token, ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
    if (r.status === 401) { logout(); throw new Error("Jeton refusé"); }
    if (!r.ok) throw new Error((await r.text()) || r.statusText);
    return r.status === 204 ? null : r.json();
  }

  function logout() { clearInterval(timer); try { localStorage.removeItem(KEY); } catch {} token = null; show(false); }
  function show(ok) { $("login").hidden = ok; $("app").hidden = !ok; }

  const gb = (b) => (b / 1e9).toFixed(1) + " Go";
  const lvl = (p) => (p > 85 ? "crit" : p > 65 ? "hi" : "");

  function spark(id, data) {
    const p = $(id).querySelector("path");
    if (data.length < 2) { p.setAttribute("d", ""); return; }
    const t0 = data[0].t, t1 = data[data.length - 1].t;
    p.setAttribute("d", data.map((s, i) => (i ? "L" : "M") + (((s.t - t0) / Math.max(1, t1 - t0)) * 300).toFixed(1) + "," + (54 - Math.min(100, s.v) / 100 * 52).toFixed(1)).join(" "));
  }

  function applyPerms() {
    const show = (id, on) => { const e = $(id); if (e) e.hidden = !on; };
    show("sec-status", can("status"));
    show("sec-players", can("status") && can("players"));
    show("sec-say", can("announce"));
    show("sec-logs", can("logs"));
    document.querySelectorAll(".sec-charts").forEach((e) => (e.hidden = !can("charts")));
    show("b-start", can("start")); show("b-restart", can("restart")); show("b-stop", can("stop")); show("b-backup", can("backup"));
    show("sec-control", ["start", "restart", "stop", "backup"].some(can));
    $("who").textContent = me.admin ? "" : "· invité : " + me.name;
  }

  async function refresh() {
    if (!can("status")) { $("state").textContent = "Accès limité"; $("dot").className = "dot"; return; }
    try {
      const s = await api("snapshot");
      $("dot").className = "dot " + (s.running ? "on" : "off");
      $("state").textContent = s.running ? "Serveur en ligne" : "Serveur arrêté";
      $("cpu").textContent = s.cpu_percent.toFixed(0) + " %";
      $("cpubar").style.width = Math.min(100, s.cpu_percent) + "%"; $("cpubar").className = lvl(s.cpu_percent);
      $("mem").textContent = gb(s.memory_bytes);
      $("membar").style.width = Math.min(100, s.memory_percent) + "%"; $("membar").className = lvl(s.memory_percent);
      $("pl").textContent = s.players.length + " / " + (s.metrics ? s.metrics.maxplayernum : "–");
      $("fps").textContent = s.metrics ? s.metrics.serverfps : "–";
      $("day").textContent = s.metrics ? "Jour " + s.metrics.days : "";
      $("b-start").disabled = s.running; $("b-restart").disabled = !s.running; $("b-stop").disabled = !s.running;
      const box = $("players"); box.textContent = "";
      if (!s.players.length) { box.textContent = "Personne en ligne."; }
      s.players.forEach((p) => {
        const row = document.createElement("div"); row.className = "player";
        const n = document.createElement("span"); n.className = "n"; n.textContent = p.name;   // textContent : les pseudos sont non fiables
        const sm = document.createElement("small"); sm.textContent = "niv. " + p.level + " · " + Math.round(p.ping) + " ms";
        const k = document.createElement("button"); k.textContent = "Expulser";
        k.hidden = !can("kick");
        k.onclick = () => confirm("Expulser " + p.name + " ?") && act(() => api("kick", { method: "POST", body: JSON.stringify({ user_id: p.userId }) }), p.name + " expulsé");
        row.append(n, sm, k); box.append(row);
      });
      const l = can("logs") ? await api("logs" + (offset === null ? "" : "?offset=" + offset)) : { lines: [], offset: 0 };
      if (offset !== null && l.offset < offset) $("logs").textContent = "";   // fichier tronqué/rotaté
      offset = l.offset;
      if (l.lines.length) {
        const el = $("logs"), stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 24;
        l.lines.forEach((line) => { const d = document.createElement("div"); d.textContent = line; if (/error|fatal|crash/i.test(line)) d.className = "e"; else if (/warn/i.test(line)) d.className = "w"; el.append(d); });
        while (el.childElementCount > 300) el.removeChild(el.firstChild);
        if (stick) el.scrollTop = el.scrollHeight;
      }
    } catch (e) { if (token) toast(e.message); }
  }

  async function refreshCharts() {
    if (!can("charts")) return;
    try {
      const h = await api("history?hours=6");
      spark("s-cpu", h.map((x) => ({ t: x.t, v: x.cpu }))); spark("s-mem", h.map((x) => ({ t: x.t, v: x.mem_percent })));
    } catch {}
  }

  async function act(fn, okMsg) { try { await fn(); toast(okMsg); setTimeout(refresh, 1500); } catch (e) { toast(e.message); } }

  async function start() {
    show(true); offset = null; $("logs").textContent = "";
    try { me = await api("me"); } catch { return; }   // 401 : api() a déjà ramené à l'écran de connexion
    applyPerms();
    refresh(); refreshCharts();
    let n = 0;
    timer = setInterval(() => { if (document.hidden) return; refresh(); if (++n % 20 === 0) refreshCharts(); }, 3000);
  }

  $("go").onclick = async () => {
    token = $("tok").value.trim();
    try { await api("me"); localStorage.setItem(KEY, token); $("loginerr").textContent = ""; start(); }
    catch { $("loginerr").textContent = "Jeton incorrect."; }
  };
  $("logout").onclick = logout;
  $("b-start").onclick = () => act(() => api("control/start", { method: "POST" }), "Démarrage demandé");
  $("b-restart").onclick = () => confirm("Redémarrer le serveur ? Les joueurs seront déconnectés.") && act(() => api("control/restart", { method: "POST" }), "Redémarrage demandé");
  $("b-stop").onclick = () => confirm("Arrêter le serveur ? Les joueurs seront déconnectés.") && act(() => api("control/stop", { method: "POST" }), "Arrêt demandé");
  $("b-backup").onclick = () => act(() => api("backup", { method: "POST" }), "Sauvegarde créée");
  $("b-say").onclick = () => { const v = $("msg").value.trim(); if (v) act(() => api("announce", { method: "POST", body: JSON.stringify({ message: v }) }), "Annonce envoyée").then(() => ($("msg").value = "")); };

  // Un nouveau lien avec #token= ouvert dans l'onglet déjà affiché : on recharge pour le prendre en compte.
  window.addEventListener("hashchange", () => { if (/token=/.test(location.hash)) location.reload(); });

  if (token) start(); else show(false);
})();
</script>
</body>
</html>
